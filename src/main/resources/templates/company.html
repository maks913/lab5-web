<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Company Page</title>
    <link rel="stylesheet" href="/webjars/bootstrap/5.2.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light p-4">

<div class="container shadow-sm bg-white p-3 rounded-2">
    <div class="d-flex flex-row justify-content-between align-content-center mb-2">
        <h1><span class="bi bi-building"></span>Companies</h1>
        <button class="btn btn-primary shadow-sm" style="width: 175px;height: 40px" data-bs-toggle="modal"
                data-bs-target="#createCompanyModal">
            <span class="bi bi-plus-circle-fill"></span>
            Create Company
        </button>
    </div>
    <table class="table table-hover">
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Created At</th>
            <th>Description</th>
            <th>Quantity employees</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="company: ${companies}">
            <td th:text="${company.id}"/>
            <td th:text="${company.name}"/>
            <td th:text="${#temporals.format(company.createdAt, 'dd-MM-yyyy HH:mm')}"/>
            <td th:text="${company.description}"/>
            <td th:text="${company.quantityEmployees}"/>
            <td>

                <button type="button"
                        class="btn btn-primary"
                        data-bs-toggle="modal"
                        data-bs-target="#updateCompanyModal"
                        th:attr="data-id=${company.id}"
                        onclick="fetchEditCompany(this)">
                    <span class="bi bi-pencil-square"></span>
                    Update
                </button>

                <button type="button"
                        class="btn btn-danger"
                        data-bs-toggle="modal"
                        data-bs-target="#confirmModal"
                        th:data-id="${company.id}">
                    <span class="bi bi-trash-fill"></span>
                </button>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<div class="modal fade" id="createCompanyModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="createCompanyModalLabel">Create Company</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="form-create-company"
                      th:action="@{/company/save}"
                      th:object="${company}"
                      method="post">

                    <label for="companyName" class="form-label">Name:</label>
                    <input id="companyName"
                           class="form-control"
                           type="text"
                           th:field="*{name}">

                    <label for="companyDescription" class="form-label">Description:</label>
                    <input id="companyDescription"
                           class="form-control"
                           type="text"
                           th:field="*{description}">

                    <label for="companyQuantity" class="form-label">Quantity Employees:</label>
                    <input id="companyQuantity"
                           class="form-control"
                           type="number"
                           th:field="*{quantityEmployees}">
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button form="form-create-company" type="submit" class="btn btn-primary">Create Company</button>
            </div>
        </div>
    </div>
</div>
<div class="modal fade" id="updateCompanyModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="updateCompanyModalLabel">Update Company</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">

                <form id="form-update-company"
                      th:action="@{/company/save}"
                      th:object="${companyEdit}"
                      method="post">

                    <label for="companyIdEdit" class="form-label">ID:</label>
                    <input id="companyIdEdit"
                           name="id"
                           class="form-control"
                           type="number"
                           readonly>

                    <label for="companyNameEdit" class="form-label">Name:</label>
                    <input id="companyNameEdit"
                           name="name"
                           class="form-control"
                           type="text"
                           th:field="*{name}"
                           required>

                    <label for="createdAtEdit" class="form-label">Created At:</label>
                    <input id="createdAtEdit"
                           name="createdAt"
                           class="form-control"
                           disabled>

                    <label for="companyDescriptionEdit" class="form-label">Description:</label>
                    <input id="companyDescriptionEdit"
                           name="description"
                           class="form-control"
                           th:field="*{description}"
                           type="text">

                    <label for="companyQuantityEdit" class="form-label">
                        Quantity Employees:
                    </label>
                    <input id="companyQuantityEdit"
                           name="quantityEmployees"
                           class="form-control"
                           type="number"
                           th:field="*{quantityEmployees}"
                           min="0"
                           required>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button form="form-update-company" type="submit" class="btn btn-primary">Update Company</button>
            </div>
        </div>
    </div>
</div>
<div class="modal fade" id="confirmModal" tabindex="-1" aria-labelledby="confirmModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="confirmModalLabel">Confirm Delete</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="form-delete-company" method="post">
                    <p>Are you sure you want to delete company with ID: <span id="spn-delete-id"></span>?</p>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="submit" form="form-delete-company" class="btn btn-danger">Delete company</button>
            </div>
        </div>
    </div>
</div>

<div class="container mt-2 p-0">
    <a th:href="@{/vacancy}" class="btn btn-outline-primary"><span class="bi bi-briefcase-fill me-2"></span>Vacancy Page</a>
</div>

<script src="/webjars/bootstrap/5.2.3/js/bootstrap.bundle.min.js"></script>
<script>

    const fetchEditCompany = async function (button) {
        const id = button.dataset.id;

        const response = await fetch(`/company/edit/${id}`);

        if (!response.ok) {
            console.error("Failed to load company:", response.status);
            return;
        }

        const editCompany = await response.json();

        document.getElementById('companyIdEdit').value = editCompany.id;
        document.getElementById('companyNameEdit').value = editCompany.name;
        document.getElementById('createdAtEdit').value = new Date(editCompany.createdAt).toLocaleString();
        document.getElementById('companyDescriptionEdit').value = editCompany.description;
        document.getElementById('companyQuantityEdit').value = editCompany.quantityEmployees;
    };

    document.getElementById('confirmModal').addEventListener('show.bs.modal', (event) => {
        const id = event.relatedTarget.getAttribute('data-id');

        document.getElementById('spn-delete-id').textContent = id;
        document.getElementById('form-delete-company').action = `/company/delete/${id}`;
    });

</script>
</body>
</html>
