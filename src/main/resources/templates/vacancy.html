<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Company Page</title>
    <link rel="stylesheet" href="/webjars/bootstrap/5.2.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light p-4">
<div th:insert="~{fragments/header::header}"></div>

<div class="container shadow-sm bg-white p-3 rounded-2">
    <div class="d-flex flex-row justify-content-between align-content-center mb-2">
        <h1><span class="bi bi-briefcase-fill"></span> Vacancies</h1>
        <button class="btn btn-primary shadow-sm" style="width: 175px;height: 40px"
                data-bs-toggle="modal" data-bs-target="#createVacancyModal">
            <span class="bi bi-plus-circle-fill"></span>
            Create Vacancy
        </button>
    </div>
    <table class="table table-hover">
        <thead>
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>City</th>
            <th>Salary</th>
            <th>Company</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="vacancy: ${vacancies}">
            <td th:text="${vacancy.id}"/>
            <td th:text="${vacancy.title}"/>
            <td th:text="${vacancy.city}"/>
            <td th:text="${vacancy.salary}"/>
            <td th:text="${vacancy.companyDto.name}"/>
            <td>
                <button type="button"
                        class="btn btn-primary"
                        data-bs-toggle="modal"
                        data-bs-target="#updateVacancyModal"
                        th:attr="data-id=${vacancy.id}"
                        onclick="fetchEditVacancy(this)">
                    <span class="bi bi-pencil-square"></span>
                    Update
                </button>
                <button type="submit"
                        class="btn btn-danger"
                        data-bs-toggle="modal"
                        data-bs-target="#confirmModal"
                        th:data-id="${vacancy.id}"><span class="bi bi-trash-fill"></span></button>
            </td>
        </tr>
        <tr th:if="${vacancies.isEmpty()}">
            <td colspan="6" class="text-center text-muted py-4">
                <span class="bi bi-inbox"></span>
                No vacancies found
            </td>
        </tr>
        </tbody>
    </table>
</div>

<div class="modal fade" id="createVacancyModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="createVacancyModalLabel">Create Vacancy</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="form-create-vacancy"
                      th:action="@{/vacancy/save}"
                      th:object="${vacancy}"
                      method="post">

                    <label for="vacancyTitle" class="form-label">Title:</label>
                    <input id="vacancyTitle"
                           class="form-control"
                           type="text"
                           th:field="*{title}" required>

                    <p class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">Title error</p>

                    <label for="vacancyCity" class="form-label">City:</label>
                    <input id="vacancyCity"
                           class="form-control"
                           type="text"
                           th:field="*{city}" required>

                    <label for="vacancySalary" class="form-label">Salary:</label>
                    <input id="vacancySalary"
                           class="form-control"
                           type="number"
                           th:field="*{salary}" required>

                    <label for="vacancyCompany" class="form-label">Company:</label>
                    <select id="vacancyCompany" class="form-select" th:field="*{companyDto.id}" required>
                        <option th:if="${companies.isEmpty()}"
                                value=""
                                disabled
                                selected>
                            Don't have any company
                        </option>
                        <option th:each="company: ${companies}"
                                th:value="${company.id}"
                                th:text="${company.name}">
                        </option>
                    </select>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button form="form-create-vacancy" type="submit" class="btn btn-primary">Create Vacancy</button>
            </div>
        </div>
    </div>
</div>
<div class="modal fade" id="updateVacancyModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="updateCompanyModalLabel">Update Vacancy</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">

                <form id="form-update-vacancy"
                      th:action="@{/vacancy/save}"
                      th:object="${vacancyEdit}"
                      method="post">

                    <label for="vacancyIdEdit" class="form-label">ID:</label>
                    <input id="vacancyIdEdit"
                           name="id"
                           class="form-control"
                           type="number"
                           readonly>

                    <label for="vacancyTitleEdit" class="form-label">Title:</label>
                    <input id="vacancyTitleEdit"
                           name="name"
                           class="form-control"
                           type="text"
                           th:field="*{title}"
                           required>

                    <label for="vacancyCityEdit" class="form-label">City:</label>
                    <input id="vacancyCityEdit"
                           name="createdAt"
                           class="form-control"
                           th:field="*{city}"
                           required>

                    <label for="vacancySalaryEdit" class="form-label">Salary:</label>
                    <input id="vacancySalaryEdit"
                           name="description"
                           class="form-control"
                           th:field="*{salary}"
                           type="text" required>

                    <label for="vacancyCompanyEdit" class="form-label">
                        Company:
                    </label>
                    <select id="vacancyCompanyEdit"
                            class="form-select"
                            th:field="*{companyDto.id}" required>
                        <option th:each="company: ${companies}"
                                th:value="${company.id}"
                                th:text="${company.name}">
                        </option>
                    </select>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button form="form-update-vacancy" type="submit" class="btn btn-primary">Vacancy update</button>
            </div>
        </div>
    </div>
</div>
<div class="modal fade" id="confirmModal" tabindex="-1" aria-labelledby="confirmModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="confirmModalLabel">Confirm Delete</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="form-delete-vacancy" method="post">
                    <p>Are you sure you want to delete vacancy with ID: <span id="spn-delete-id"></span>?</p>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="submit" form="form-delete-vacancy" class="btn btn-danger">Delete vacancy</button>
            </div>
        </div>
    </div>
</div>

<script src="/webjars/bootstrap/5.2.3/js/bootstrap.bundle.min.js"></script>
<script>

    const fetchEditVacancy = async function (button) {
        const id = button.dataset.id;

        const response = await fetch(`/vacancy/edit/${id}`);

        if (!response.ok) {
            console.error("Failed to load company:", response.status);
            return;
        }

        const vacancyEdit = await response.json();

        document.getElementById('vacancyIdEdit').value = vacancyEdit.id;
        document.getElementById('vacancyTitleEdit').value = vacancyEdit.title;
        document.getElementById('vacancyCityEdit').value = vacancyEdit.city;
        document.getElementById('vacancySalaryEdit').value = vacancyEdit.salary;
        document.getElementById('vacancyCompanyEdit').value = vacancyEdit.companyDto.id;
    };

    document.getElementById('confirmModal').addEventListener('show.bs.modal', (event) => {
        const id = event.relatedTarget.getAttribute('data-id');

        document.getElementById('spn-delete-id').textContent = id;
        document.getElementById('form-delete-vacancy').action = `/vacancy/delete/${id}`;
    });
</script>
</body>
</html>
